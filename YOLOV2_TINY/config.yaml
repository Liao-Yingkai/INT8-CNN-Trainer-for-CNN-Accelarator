# Network defaults follow pjreddie/darknet yolov2-tiny-voc.cfg.
model:
  input_height: 416
  input_width: 416
  num_classes: 20
  num_anchors: 5
  # Anchor width and height are in output-grid cell units at 416x416.
  anchors:
    - [1.08, 1.19]
    - [3.42, 4.41]
    - [6.63, 11.38]
    - [9.42, 5.11]
    - [16.62, 10.52]
  classes:
    - aeroplane
    - bicycle
    - bird
    - boat
    - bottle
    - bus
    - car
    - cat
    - chair
    - cow
    - diningtable
    - dog
    - horse
    - motorbike
    - person
    - pottedplant
    - sheep
    - sofa
    - train
    - tvmonitor
